AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Astra Interior Designer backend on ECS Fargate in an isolated VPC.
  CloudFront supplies the HTTPS endpoint; Modal runs only agent sandboxes.
  Deploy only in account 022104542793, us-east-1, with CAPABILITY_NAMED_IAM.
  Existing DynamoDB tables, S3 bucket, backend secret, sandbox role, and ECR
  repository are external to this stack. Add TaskRoleArn to the existing
  sandbox role trust after stack creation and before creating API sessions.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable tag or digest in Astra's us-east-1 ECR repository.
    AllowedPattern: '^022104542793\.dkr\.ecr\.us-east-1\.amazonaws\.com/astra-interior-designer-backend(:[A-Za-z0-9_][A-Za-z0-9_.-]*|@sha256:[a-f0-9]{64})$'
  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: com.amazonaws.global.cloudfront.origin-facing in us-east-1.
    AllowedPattern: '^pl-[a-f0-9]+$'
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    Description: Random secret shared only by CloudFront and the ALB listener rule.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.84.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: astra-interior-designer}
        - {Key: project, Value: astra-interior-designer}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: astra-interior-designer}
        - {Key: project, Value: astra-interior-designer}

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.84.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: astra-interior-designer-public-a}
        - {Key: project, Value: astra-interior-designer}

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.84.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: astra-interior-designer-public-b}
        - {Key: project, Value: astra-interior-designer}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: astra-interior-designer-public}
        - {Key: project, Value: astra-interior-designer}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Astra API tasks; ingress comes only from the ALB.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: TLS to AWS, OpenAI, and Modal APIs and image registries.
      Tags:
        - {Key: Name, Value: astra-interior-designer-task}
        - {Key: project, Value: astra-interior-designer}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Astra origin; HTTP only from CloudFront origin-facing IPs.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin traffic only.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          DestinationSecurityGroupId: !Ref TaskSecurityGroup
          Description: Forward requests and health checks to the Astra task.
      Tags:
        - {Key: Name, Value: astra-interior-designer-alb}
        - {Key: project, Value: astra-interior-designer}

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Astra API traffic from the ALB only.

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: InternetGatewayAttachment
    Properties:
      Name: astra-interior-designer-api
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
      Tags:
        - {Key: project, Value: astra-interior-designer}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: astra-interior-designer-api
      VpcId: !Ref Vpc
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '120'}
      Tags:
        - {Key: project, Value: astra-interior-designer}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden

  CloudFrontOriginRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Astra-Origin-Verify
            Values: [!Ref OriginSecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: astra-interior-designer
      ClusterSettings:
        - {Name: containerInsights, Value: disabled}
      Tags:
        - {Key: project, Value: astra-interior-designer}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /astra-interior-designer/backend
      RetentionInDays: 7
      Tags:
        - {Key: project, Value: astra-interior-designer}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: astra-interior-designer-ecs-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: '022104542793'
              ArnLike:
                aws:SourceArn: arn:aws:ecs:us-east-1:022104542793:*
      Policies:
        - PolicyName: astra-interior-designer-backend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - arn:aws:dynamodb:us-east-1:022104542793:table/astra-interior-designer-sessions
                  - arn:aws:dynamodb:us-east-1:022104542793:table/astra-interior-designer-messages
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:us-east-1:022104542793:secret:astra-interior-designer/backend-DmkzbG
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - arn:aws:s3:::astra-interior-designer-files-022104542793/sandboxes/*/inputs/*
                  - arn:aws:s3:::astra-interior-designer-files-022104542793/sandboxes/*/scene.glb
                  - arn:aws:s3:::astra-interior-designer-files-022104542793/sandboxes/*/render.png
              - Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::astra-interior-designer-files-022104542793
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: arn:aws:iam::022104542793:role/astra-interior-designer-sandbox-s3
      Tags:
        - {Key: project, Value: astra-interior-designer}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: astra-interior-designer-ecs-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: '022104542793'
              ArnLike:
                aws:SourceArn: arn:aws:ecs:us-east-1:022104542793:*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: astra-interior-designer-modal-token
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:us-east-1:022104542793:secret:astra-interior-designer/backend-DmkzbG
      Tags:
        - {Key: project, Value: astra-interior-designer}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: astra-interior-designer-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      TaskRoleArn: !GetAtt TaskRole.Arn
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 120
          PortMappings:
            - {ContainerPort: 8000, Protocol: tcp}
          Environment:
            - {Name: AWS_REGION, Value: us-east-1}
            - {Name: AWS_DEFAULT_REGION, Value: us-east-1}
            - {Name: AWS_SECRET_ID, Value: astra-interior-designer/backend}
            - {Name: SESSIONS_TABLE, Value: astra-interior-designer-sessions}
            - {Name: MESSAGES_TABLE, Value: astra-interior-designer-messages}
            - {Name: S3_BUCKET, Value: astra-interior-designer-files-022104542793}
            - {Name: AGENT_MODEL, Value: gpt-6-astra}
            - Name: CORS_ORIGINS
              Value: '["http://localhost:3000","http://localhost:5173"]'
            - {Name: MODAL_IMAGE, Value: 'astra-blender:v6'}
            - Name: MODAL_LAUNCH_COMMAND
              Value: '["python","/opt/astra/runtime.py","start"]'
            - Name: MODAL_HEALTH_COMMAND
              Value: '["python","/opt/astra/runtime.py","health"]'
            - Name: MODAL_RECONNECT_COMMAND
              Value: '["python","/opt/astra/runtime.py","reconnect-executor"]'
            - Name: MODAL_SYNC_INPUTS_COMMAND
              Value: '["python","/opt/astra/runtime.py","sync-inputs"]'
            - {Name: MODAL_EXECUTOR_SECRET_NAME, Value: astra-openai-executor}
            - Name: SANDBOX_S3_ROLE_ARN
              Value: arn:aws:iam::022104542793:role/astra-interior-designer-sandbox-s3
          Secrets:
            - Name: MODAL_TOKEN_ID
              ValueFrom: 'arn:aws:secretsmanager:us-east-1:022104542793:secret:astra-interior-designer/backend-DmkzbG:MODAL_TOKEN_ID::'
            - Name: MODAL_TOKEN_SECRET
              ValueFrom: 'arn:aws:secretsmanager:us-east-1:022104542793:secret:astra-interior-designer/backend-DmkzbG:MODAL_TOKEN_SECRET::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: backend
      Tags:
        - {Key: project, Value: astra-interior-designer}

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - CloudFrontOriginRule
      - TaskIngressFromAlb
      - PublicRoute
      - SubnetARouteAssociation
      - SubnetBRouteAssociation
    Properties:
      ServiceName: astra-interior-designer-backend
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 180
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - {Key: project, Value: astra-interior-designer}

  DisabledCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: astra-interior-designer-no-cache
        Comment: Every authenticated API request must reach the backend.
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: astra-interior-designer-api-requests
        Comment: Forward Authorization, CORS, SSE headers and query strings.
        HeadersConfig: {HeaderBehavior: allViewer}
        CookiesConfig: {CookieBehavior: none}
        QueryStringsConfig: {QueryStringBehavior: all}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Astra Interior Designer HTTPS API
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: astra-api-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            OriginCustomHeaders:
              - HeaderName: X-Astra-Origin-Verify
                HeaderValue: !Ref OriginSecret
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 60
            # Omit ResponseCompletionTimeout: active SSE streams have no total cap.
        DefaultCacheBehavior:
          TargetOriginId: astra-api-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: false
          CachePolicyId: !Ref DisabledCachePolicy
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
      Tags:
        - {Key: project, Value: astra-interior-designer}

Outputs:
  ApiUrl:
    Description: Generated public HTTPS API base URL.
    Value: !Sub 'https://${Distribution.DomainName}'
  CloudFrontDistributionId:
    Value: !Ref Distribution
  TaskRoleArn:
    Description: Add this principal to the existing Astra sandbox S3 role trust.
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TaskRoleArn'
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  AlbDnsName:
    Description: Origin only; requests need CloudFront network and secret header.
    Value: !GetAtt LoadBalancer.DNSName
  LogGroupName:
    Value: !Ref LogGroup
