# Optional diagnostic CLI configuration. Agents API supplies its MCP tool config.
[mcp_servers.blender]
command = "/usr/local/bin/blender-mcp"
args = []
cwd = "/workspace"
enabled = true
required = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.blender.env]
BLENDER_HOST = "127.0.0.1"
BLENDER_PORT = "9876"
DISABLE_TELEMETRY = "true"
