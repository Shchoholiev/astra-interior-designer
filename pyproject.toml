[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-interior-designer"
version = "0.1.0"
description = "FastAPI backend for Astra Interior Designer"
readme = "BACKEND.md"
requires-python = ">=3.12"
dependencies = [
    "agent-api-sdk",
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[dependency-groups]
dev = ["ruff>=0.9,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/astra_interior_designer"]

[tool.fastapi]
entrypoint = "astra_interior_designer.main:app"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
agent-api-sdk = { git = "https://github.com/OpenAI-Early-Access/agents-api-python-preview.git" }
