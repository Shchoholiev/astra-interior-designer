[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-interior-designer"
version = "0.1.0"
description = "FastAPI backend for Astra Interior Designer"
readme = "BACKEND.md"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.42,<2",
    "fastapi[standard]>=0.115,<1.0",
    "modal==1.5.5",
    "openai>=3.13,<4",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = ["ruff>=0.9,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/astra_interior_designer"]

[tool.fastapi]
entrypoint = "astra_interior_designer.main:app"

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
